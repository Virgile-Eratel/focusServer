<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Checking…</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: light-dark(#fafafa, #111);
        color: light-dark(#111, #eee);
      }
      main {
        text-align: center;
        max-width: 28rem;
        padding: 2rem;
      }
      h1 {
        font-size: 1.1rem;
        font-weight: 600;
        margin: 0 0 0.5rem;
      }
      p {
        font-size: 0.9rem;
        color: light-dark(#555, #aaa);
        margin: 0.25rem 0;
      }
      .domain {
        font-weight: 600;
        word-break: break-all;
      }
      .badge {
        display: inline-block;
        margin-top: 0.75rem;
        padding: 0.2rem 0.7rem;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 600;
      }
      .badge.blocked {
        background: #dc2626;
        color: #fff;
      }
      .badge.category {
        background: light-dark(#e5e5e5, #333);
        color: inherit;
        margin-left: 0.4rem;
        font-weight: 500;
      }
      button {
        margin-top: 1rem;
        padding: 0.4rem 1rem;
        border: 1px solid light-dark(#ccc, #444);
        border-radius: 0.5rem;
        background: transparent;
        color: inherit;
        font: inherit;
        font-size: 0.85rem;
        cursor: pointer;
      }
      .spinner {
        margin: 0 auto 1rem;
        width: 1.5rem;
        height: 1.5rem;
        border: 2px solid light-dark(#ddd, #333);
        border-top-color: light-dark(#555, #ccc);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <main id="root"></main>
    <script
      type="module"
      src="/src/pages/checking.ts"
    ></script>
  </body>
</html>
